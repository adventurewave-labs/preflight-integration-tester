[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight-integration-tester"
version = "0.1.0"
description = "Pre-purchase AI readiness diagnostic for enterprise systems"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "sqlalchemy>=2.0.0",
    "celery>=5.3.0",
    "redis>=4.6.0",
    "structlog>=23.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "aiosqlite>=0.19.0",
]

[project.scripts]
preflight = "preflight.cli.main:cli"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=preflight --cov-report=term-missing"
markers = [
    "benchmark: performance benchmark tests",
    "slow: slow integration tests",
    "unit: unit tests",
]

[tool.coverage.run]
source = ["preflight"]
omit = ["tests/*", "setup.py"]
