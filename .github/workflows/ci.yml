name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Install dependencies
        run: |
          python${{ matrix.python-version }} -m pip install --upgrade pip setuptools wheel
          python${{ matrix.python-version }} -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: python${{ matrix.python-version }} -m ruff check preflight/ tests/ || true

      - name: Type check with mypy
        run: python${{ matrix.python-version }} -m mypy preflight/ --ignore-missing-imports || true

      - name: Run tests
        run: |
          python${{ matrix.python-version }} -m pytest tests/unit/ -v --tb=short \
            --cov=preflight --cov-report=term-missing \
            --cov-report=xml:coverage.xml

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: preflight_test
          POSTGRES_USER: preflight
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Install dependencies
        run: python3.11 -m pip install -e ".[dev]"

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://preflight:test_pass@localhost:5432/preflight_test
          REDIS_URL: redis://localhost:6379/0
        run: python3.11 -m pytest tests/integration/ -v --tb=short || true

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Install dependencies
        run: python3.11 -m pip install -e ".[dev]"

      - name: Run benchmarks
        run: python3.11 -m pytest tests/benchmarks/ -v --tb=short -m benchmark || true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Build Docker image
        run: docker build --target production -t preflight-integration-tester:test .

      - name: Test Docker image
        run: |
          docker run --rm -d --name preflight-test -p 8080:8080 preflight-integration-tester:test
          sleep 10
          curl -f http://localhost:8080/health || echo "Health check failed (expected if DB not configured)"
          docker stop preflight-test || true
